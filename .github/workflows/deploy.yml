name: Deploy to Server

on:
  push:
    branches: [master] # Adjust branch name as needed

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.108.95.112
          username: arvigeus
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/arvigeus/arvigeus.one || exit 1

            # Check if repository is dirty (has uncommitted changes)
            if ! git diff-index --quiet HEAD --; then
              echo "ERROR: Repository has uncommitted changes!"
              echo "Uncommitted files:"
              git status --porcelain
              echo ""
              echo "Please commit or stash changes before deploying:"
              echo "  git add . && git commit -m 'Manual changes' && git push"
              echo "  OR: git stash"
              exit 1
            fi

            # Check if there are untracked files
            if [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "WARNING: Repository has untracked files:"
              git ls-files --others --exclude-standard
              echo ""
              echo "Consider adding these files to .gitignore or committing them"
              echo "Continuing deployment..."
            fi

            # Fetch latest changes
            echo "Fetching latest changes..."
            git fetch origin master

            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/master)
            DEPLOY_STATE_FILE=$(git rev-parse --git-path last-successful-deploy)
            LAST_DEPLOYED=""

            if [ -f "$DEPLOY_STATE_FILE" ]; then
              LAST_DEPLOYED=$(cat "$DEPLOY_STATE_FILE")
            fi

            # Diff from the last deployment that passed its smoke tests, not
            # merely from the current checkout. If a previous run pulled the
            # commit and then failed, rerunning the workflow retries the same
            # affected services instead of exiting early.
            if [ -n "$LAST_DEPLOYED" ] &&
              git cat-file -e "$LAST_DEPLOYED^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$LAST_DEPLOYED" "$REMOTE"; then
              echo "Last successful deployment: $LAST_DEPLOYED"
              CHANGED_FILES=$(git diff --name-only "$LAST_DEPLOYED" "$REMOTE")
            elif [ "$LOCAL" != "$REMOTE" ]; then
              echo "No deployment state yet; using current checkout $LOCAL as the baseline"
              CHANGED_FILES=$(git diff --name-only "$LOCAL" "$REMOTE")
            else
              echo "No usable deployment state and checkout is current; reconciling every active service"
              CHANGED_FILES=$(git ls-tree -r --name-only "$REMOTE")
            fi

            CHANGED_SERVICES=$(
              printf '%s\n' "$CHANGED_FILES" |
                awk -F/ '$1 == "services" && $2 != "" { print $2 }' |
                sort -u |
                tr '\n' ' '
            )

            REMOVED_SERVICES=""
            for service in $CHANGED_SERVICES; do
              if ! git cat-file -e "origin/master:services/$service" 2>/dev/null; then
                REMOVED_SERVICES="$REMOVED_SERVICES $service"
              fi
            done

            if [ -n "$REMOVED_SERVICES" ]; then
              STOPPABLE_REMOVED_SERVICES=""
              for service in $REMOVED_SERVICES; do
                if [ -d "services/$service" ]; then
                  STOPPABLE_REMOVED_SERVICES="$STOPPABLE_REMOVED_SERVICES $service"
                fi
              done
              if [ -n "$STOPPABLE_REMOVED_SERVICES" ]; then
                echo "Stopping removed services before pulling:$STOPPABLE_REMOVED_SERVICES"
                # shellcheck disable=SC2086
                if ! ./run.sh stop $STOPPABLE_REMOVED_SERVICES; then
                  echo "ERROR: Failed to stop removed services"
                  exit 1
                fi
              fi
            fi

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "Fast-forwarding checkout to $REMOTE..."
              if ! git merge --ff-only origin/master; then
                echo "Git fast-forward failed; manual intervention required"
                exit 1
              fi
            else
              echo "Checkout already at $REMOTE; reconciling deployment state"
            fi

            ACTIVE_CHANGED_SERVICES=""
            for service in $CHANGED_SERVICES; do
              if [ -d "services/$service" ]; then
                ACTIVE_CHANGED_SERVICES="$ACTIVE_CHANGED_SERVICES $service"
              fi
            done

            # Rebuild Homer whenever service dashboard metadata changes.
            if echo "$CHANGED_FILES" | grep -qE '^services/[^/]+/(data\.json|logo\.(png|svg))$'; then
              if ! echo " $ACTIVE_CHANGED_SERVICES " | grep -q ' homer '; then
                ACTIVE_CHANGED_SERVICES="$ACTIVE_CHANGED_SERVICES homer"
              fi
            fi

            if [ -n "$ACTIVE_CHANGED_SERVICES" ]; then
              echo "Updating changed services:$ACTIVE_CHANGED_SERVICES"
              # shellcheck disable=SC2086
              if ! ./run.sh update $ACTIVE_CHANGED_SERVICES; then
                echo "ERROR: Failed to update changed services"
                exit 1
              fi
            else
              echo "No active service changes detected, skipping update"
            fi

            if ! ./run.sh prune-stale; then
              echo "ERROR: Failed to prune stale containers"
              exit 1
            fi

            # Reload Caddy if any caddy.conf changed but the caddy container itself
            # wasn't recreated (mount-only changes don't trigger compose to restart it)
            if echo "$CHANGED_FILES" | grep -qE '^services/[^/]+/caddy\.conf$|^services/caddy/config/'; then
              if ! echo " $ACTIVE_CHANGED_SERVICES " | grep -q ' caddy '; then
                echo "Caddy config changed, reloading Caddy..."
                if ! docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                  echo "ERROR: Failed to reload Caddy"
                  exit 1
                fi
              fi
            fi

            # Smoke test every active HTTP endpoint so stale or broken services
            # are caught even when the current push only removed a service.
            if ! ./run.sh smoke; then
              echo "ERROR: Smoke test failed"
              exit 1
            fi

            printf '%s\n' "$REMOTE" > "$DEPLOY_STATE_FILE"
            echo "Deployment successful!"
