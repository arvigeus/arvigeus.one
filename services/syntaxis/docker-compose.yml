services:
  syntaxis:
    image: ghcr.io/katawaredev/syntaxis:0.6.0
    container_name: syntaxis
    hostname: syntaxis
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 2560m
    memswap_limit: 2560m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${PUID}:${PGID}"
    environment:
      HOME: /home/dev
      SHELL: /bin/bash
      IP: 0.0.0.0
      PORT: 8080
      SYNTAXIS_PROJECTS_ROOT: /Projects
      SYNTAXIS_PASSWORD_HASH: "${SYNTAXIS_PASSWORD_HASH:?SYNTAXIS_PASSWORD_HASH is required}"
      SYNTAXIS_API_TOKEN: "${SYNTAXIS_API_TOKEN:-}"
      VERCEL_OIDC_TOKEN: "${VERCEL_OIDC_TOKEN:-}"
      SYNTAXIS_PREVIEW_ORIGIN: "https://preview.code.${DOMAIN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA}/syntaxis/home:/home/dev
      - ${HOST_HOME}/.gitconfig:/home/dev/.gitconfig:ro
      - ${HOST_HOME}/.ssh:/home/dev/.ssh:ro
      - ${HOST_HOME}/.gnupg:/home/dev/.gnupg
      - ${HOST_PROJECTS:-${HOST_HOME}/Projects}:/Projects
    working_dir: /Projects
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}
